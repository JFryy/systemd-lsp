[package]
name = "systemd-lsp"
version = "0.2.1"
edition = "2021"
authors = ["James Fotherby <fotherby1@gmail.com>"]
description = "Language Server Protocol implementation for systemd unit files"
license = "MIT"
repository = "https://github.com/jfryy/systemd-lsp"
homepage = "https://github.com/jfryy/systemd-lsp"
documentation = "https://github.com/jfryy/systemd-lsp"
keywords = ["systemd", "lsp", "language-server", "linux", "unit-files"]
categories = ["development-tools", "text-editors"]
readme = "README.md"
exclude = [
    "target/",
    "*.log",
    "*.tmp",
    ".git/",
    ".github/",
    "examples/",
    "!README.md"
]

[lib]
name = "systemd_lsp"
path = "src/lib.rs"

[[bin]]
name = "systemd-lsp"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true

[dependencies]
tower-lsp-server = "0.23.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
regex = "1.0"
dashmap = "6.1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tokio-test = "0.4"
