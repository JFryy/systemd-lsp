permissions:
  contents: write

name: Release

on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC

  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTFLAGS: "-D warnings"
  RUSTUP_MAX_RETRIES: 10

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "systemd-lsp") | .version')
          if [[ ! "$version" =~ ^([0-9]{4})\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Cargo.toml version '$version' is not YYYY.M.D. Set it to the release date, for example 2026.11.3."
            exit 1
          fi
          tag=$(printf 'v%04d.%02d.%02d' "${BASH_REMATCH[1]}" "$((10#${BASH_REMATCH[2]}))" "$((10#${BASH_REMATCH[3]}))")
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists. Bump the version in Cargo.toml before releasing."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as $tag"

      - name: Check crate packaging
        run: cargo publish --dry-run --locked

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests
        run: cargo test --release --target ${{ matrix.target }}

      - name: Create release directory
        run: mkdir -p release

      - name: Copy binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/systemd-lsp release/systemd-lsp-${{ matrix.target }}

      - name: Copy binary (Windows)
        if: matrix.os == 'windows-latest'
        run: cp target/${{ matrix.target }}/release/systemd-lsp.exe release/systemd-lsp-${{ matrix.target }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: systemd-lsp-${{ matrix.target }}
          path: release/*

  release:
    if: github.event_name == 'workflow_dispatch'
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release directory
        run: mkdir -p release

      - name: Organize artifacts
        run: |
          find artifacts -name "systemd-lsp-*" -type f -exec cp {} release/ \;
          cd release && sha256sum systemd-lsp-* > SHA256SUMS
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Release ${{ needs.prepare.outputs.tag }}"
          generate_release_notes: true
          body: |
            `systemd-lsp --version` reports `${{ needs.prepare.outputs.version }}`. Also available with `cargo install systemd-lsp`.

            ## Downloads
            - Linux x86_64: `systemd-lsp-x86_64-unknown-linux-gnu`
            - macOS Intel: `systemd-lsp-x86_64-apple-darwin`
            - macOS Apple Silicon: `systemd-lsp-aarch64-apple-darwin`
            - Windows: `systemd-lsp-x86_64-pc-windows-msvc.exe`

            Verify a download with `sha256sum --check --ignore-missing SHA256SUMS`.
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crate:
    if: github.event_name == 'workflow_dispatch'
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret is not set. The GitHub release was created; publish manually with 'cargo publish --locked' or add the secret and re-run this job."
            exit 1
          fi
          cargo publish --locked
